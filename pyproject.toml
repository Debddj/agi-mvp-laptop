[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tinyllm-agent"
version = "0.1.0"
description = "From-scratch LLM with agentic reasoning loop (plan, act, reflect)"
readme = "README.md"
license = { text = "MIT" }

requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "sentencepiece>=0.2.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N806", "N812", "E501"]
