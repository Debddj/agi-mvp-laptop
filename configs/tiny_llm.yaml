model:
  vocab_size: 2000
  n_layers: 6
  n_heads: 6
  n_kv_heads: 6
  hidden_size: 384
  mlp_ratio: 4
  max_seq_len: 8192
  image_size: 224
  patch_size: 16
  vision_hidden_dim: 384
  vision_layers: 4
  vision_heads: 6

training:
  seq_len: 128
  batch_size: 2
  lr: 0.0003
  epochs: 3
  grad_clip: 1.0
  use_amp: true
  warmup_steps: 10
  weight_decay: 0.01
